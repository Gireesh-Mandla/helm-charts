{{- if .Values.rbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.namespace }}
  name: datagaps-role
  labels:
    app: datagaps-role
    {{- with $.Values.customLabels }}
{{ toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups: ["*"]
    resources:
      - pods
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - services
      - secrets
      - deployments
      - events
      - replicasets
    verbs: ["*"]
{{- end }}